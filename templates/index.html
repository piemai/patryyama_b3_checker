<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ollie Braintree Checker</title>
    <style>
        body { font-family: Arial, sans-serif; background: #0f172a; color: #f8fafc; margin: 0; padding: 20px; }
        .container { max-width: 800px; margin: auto; background: #1e293b; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        h2 { text-align: center; color: #38bdf8; }
        label { display: block; margin-top: 10px; font-weight: bold; }
        textarea { width: 100%; height: 120px; background: #0f172a; color: #f8fafc; border: 1px solid #334155; border-radius: 4px; padding: 10px; box-sizing: border-box; }
        button { width: 100%; margin-top: 15px; background: #0284c7; color: white; border: none; padding: 12px; font-size: 16px; font-weight: bold; border-radius: 4px; cursor: pointer; }
        button:hover { background: #0369a1; }
        .results { margin-top: 20px; }
        .result-item { background: #0f172a; padding: 10px; margin-top: 8px; border-radius: 4px; border-left: 5px solid #64748b; font-family: monospace; font-size: 14px; word-break: break-all; }
        .CHARGED { border-left-color: #22c55e; }
        .DECLINED { border-left-color: #ef4444; }
        .ERROR { border-left-color: #eab308; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Partyrama Braintree Checker</h2>
        <form method="POST" action="/check">
            <label>Cards (CC|MM|YY|CVV):</label>
            <textarea name="cards" placeholder="548809...|04|27|913" required></textarea>
            
            <label>Proxies (Optional - Isang bawat linya):</label>
            <textarea name="proxies" placeholder="http://user:pass@host:port"></textarea>
            
            <button type="submit">Simulan ang Pagsusuri</button>
        </form>

        {% if results %}
        <div class="results">
            <h3>Resulta:</h3>
            {% for r in results %}
            <div class="result-item {{ r.status }}">
                <strong>[{{ r.status }}]</strong> {{ r.card }} -> {{ r.reason }}
            </div>
            {% endfor %}
        </div>
        {% endif %}
    </div>
</body>
</html>
